# nginx reverse proxy for the voice agent.
#   - terminates TLS for sar-kataria.globalvoxinc.ai
#   - proxies HTTP + WebSocket (/ws, /twilio/media-stream, /live/ws) to uvicorn
#
# Install:  sudo cp nginx-voice-agent.conf /etc/nginx/sites-available/voice-agent
#           sudo ln -s /etc/nginx/sites-available/voice-agent /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then get TLS certs with certbot (see DEPLOY.md), which rewrites the 443 block.

upstream voice_agent {
    server 127.0.0.1:8000;
}

# --- HTTP: redirect to HTTPS (certbot also manages this) ---
server {
    listen 80;
    server_name sar-kataria.globalvoxinc.ai;

    # Allow certbot's ACME challenge through before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: main app + WebSockets ---
server {
    listen 443 ssl;
    server_name sar-kataria.globalvoxinc.ai;

    # certbot fills these in (paths shown for reference):
    # ssl_certificate     /etc/letsencrypt/live/sar-kataria.globalvoxinc.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sar-kataria.globalvoxinc.ai/privkey.pem;

    # Long timeouts so long phone calls / WebSockets don't get cut.
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    client_max_body_size 20m;

    location / {
        proxy_pass         http://voice_agent;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (needed for /ws, /twilio/media-stream, /live/ws)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }
}
